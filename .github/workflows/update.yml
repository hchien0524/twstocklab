name: Daily Price Update
on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update prices from TWSE (backend)
        run: |
          pip install requests -q
          python3 << 'PY'
          import requests, json, datetime, sys
          url='https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL'
          print(f'Fetching {url}')
          try:
              r=requests.get(url, timeout=30)
              r.raise_for_status()
              data=r.json()
              print(f'Got {len(data)} rows')
              mp={d['Code']:d for d in data}
              with open('six_stock_portfolio.json','r',encoding='utf-8') as f:
                  port=json.load(f)
              cnt=0
              for s in port['stocks']:
                  c=s['code']
                  if c in mp:
                      try:
                          old=s.get('current')
                          new=float(mp[c]['ClosingPrice'].replace(',',''))
                          s['current']=new
                          print(f'{c} {old} -> {new}')
                          cnt+=1
                      except Exception as e:
                          print(f'{c} fail {e}')
              port['updated']=datetime.datetime.now().strftime('%Y-%m-%d %H:%M backend auto 1101='+str(mp.get('1101',{}).get('ClosingPrice','')) )
              with open('six_stock_portfolio.json','w',encoding='utf-8') as f:
                  json.dump(port, f, ensure_ascii=False, indent=2)
              print(f'Updated {cnt} stocks')
          except Exception as e:
              print(f'Error {e}')
              import traceback; traceback.print_exc()
              sys.exit(1)
          PY
      - name: Commit and push
        run: |
          git config user.name "price-bot"
          git config user.email "bot@github.com"
          git add six_stock_portfolio.json
          git status
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto: backend update $(date +%F) 1101=24.65 base"
          git push
