name: Daily Price Update
on:
  schedule:
    - cron: '30 6 * * 1-5'  # 台灣 14:30
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TWSE official close (backend no CORS)
        run: |
          pip install requests -q
          python3 -c "
          import requests, json, sys
          print('Fetching TWSE official...')
          url='https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL'
          try:
              data=requests.get(url, timeout=30).json()
              print(f'Got {len(data)} rows, sample {data[0]}')
              mp={d['Code']:d for d in data}
              port=json.load(open('six_stock_portfolio.json',encoding='utf-8'))
              updated=0
              for s in port['stocks']:
                  c=s['code']
                  if c in mp:
                      try:
                          old=s.get('current')
                          new=float(mp[c]['ClosingPrice'])
                          s['current']=new
                          print(f'{c} {old} -> {new}')
                          updated+=1
                      except Exception as e:
                          print(f'{c} parse fail {e}')
              import datetime
              port['updated']=datetime.datetime.now().strftime('%Y-%m-%d %H:%M close auto backend')
              json.dump(port, open('six_stock_portfolio.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
              print(f'Updated {updated} stocks')
              print(f"1101={mp.get('1101',{}).get('ClosingPrice')} 2330={mp.get('2330',{}).get('ClosingPrice')}")
          except Exception as e:
              print(f'Fetch failed {e}')
              import traceback; traceback.print_exc()
              sys.exit(1)
          "
      - name: Commit push with log
        run: |
          git config user.name "price-bot"
          git config user.email "bot@github.com"
          git add six_stock_portfolio.json
          git status
          git diff --staged
          git diff --staged --quiet && echo "No change" || (git commit -m "auto: close $(date +%F) backend update" && git push)
